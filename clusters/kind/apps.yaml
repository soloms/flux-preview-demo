apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo-ui
  namespace: flux-system
spec:
  interval: 1m
  path: ./staging/kind/demo-ui
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      external_domain: demo.localhost
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo-ui-previews
  namespace: flux-system
spec:
  interval: 1m
  path: ./staging/kind/demo-ui-previews
  prune: true
  dependsOn:
    - name: demo-ui
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      external_domain: demo.localhost
