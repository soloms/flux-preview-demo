apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Copy to 'pr-<n>' and replace NNNN with the PR number
resources:
  - ../../demo-ui
components:
  - ../_component
nameSuffix: -pr-NNNN
patches:
  - path: image-tag.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: HelmRelease
      fieldPath: metadata.name
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.ui.message
        options:
          delimiter: "."
          index: 0
